<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 240" width="480" height="240">
  <!-- Stacked Isometric Boxes -->
  <g id="boxes" transform="translate(10, 10)">
    <!-- Bottom Left Box -->
    <g transform="translate(0, 75)">
      <!-- Top Face -->
      <polygon points="55,0 110,28 55,56 0,28" fill="#9eca36" stroke="#ffffff" stroke-width="4" stroke-linejoin="round"/>
      <!-- Left Face -->
      <polygon points="0,28 55,56 55,126 0,98" fill="#88b828" stroke="#ffffff" stroke-width="4" stroke-linejoin="round"/>
      <!-- Right Face -->
      <polygon points="55,56 110,28 110,98 55,126" fill="#75a21e" stroke="#ffffff" stroke-width="4" stroke-linejoin="round"/>
      <!-- White Handle / Tape slot on left face -->
      <path d="M 22,40 L 32,45 L 32,70 L 22,65 Z" fill="#ffffff"/>
      <path d="M 25,48 L 29,50 L 29,62 L 25,60 Z" fill="#88b828"/>
    </g>

    <!-- Bottom Right Box -->
    <g transform="translate(68, 110)">
      <!-- Top Face -->
      <polygon points="55,0 110,28 55,56 0,28" fill="#9eca36" stroke="#ffffff" stroke-width="4" stroke-linejoin="round"/>
      <!-- Left Face -->
      <polygon points="0,28 55,56 55,126 0,98" fill="#88b828" stroke="#ffffff" stroke-width="4" stroke-linejoin="round"/>
      <!-- Right Face -->
      <polygon points="55,56 110,28 110,98 55,126" fill="#75a21e" stroke="#ffffff" stroke-width="4" stroke-linejoin="round"/>
      <!-- White Handle / Tape slot on left face -->
      <path d="M 22,40 L 32,45 L 32,70 L 22,65 Z" fill="#ffffff"/>
      <path d="M 25,48 L 29,50 L 29,62 L 25,60 Z" fill="#88b828"/>
    </g>

    <!-- Top Box -->
    <g transform="translate(34, 0)">
      <!-- Top Face -->
      <polygon points="55,0 110,28 55,56 0,28" fill="#9eca36" stroke="#ffffff" stroke-width="4" stroke-linejoin="round"/>
      <!-- Left Face -->
      <polygon points="0,28 55,56 55,126 0,98" fill="#88b828" stroke="#ffffff" stroke-width="4" stroke-linejoin="round"/>
      <!-- Right Face -->
      <polygon points="55,56 110,28 110,98 55,126" fill="#75a21e" stroke="#ffffff" stroke-width="4" stroke-linejoin="round"/>
      <!-- White Handle / Tape slot on left face -->
      <path d="M 22,40 L 32,45 L 32,70 L 22,65 Z" fill="#ffffff"/>
      <path d="M 25,48 L 29,50 L 29,62 L 25,60 Z" fill="#88b828"/>
    </g>
  </g>

  <!-- Typography Right Side -->
  <g transform="translate(200, 15)">
    <!-- "BIG" text in Lime Green -->
    <text x="0" y="112" font-family="'Impact', 'Arial Black', sans-serif" font-weight="900" font-size="96" fill="#9eca36" letter-spacing="-1">BIG</text>
    <!-- "GUY" text in Black -->
    <text x="145" y="112" font-family="'Impact', 'Arial Black', sans-serif" font-weight="900" font-size="96" fill="#000000" letter-spacing="-1">GUY</text>

    <!-- Black banner bar -->
    <rect x="-1" y="125" width="276" height="42" fill="#000000" rx="2" ry="2"/>
    <!-- "S T O R A G E" text in white -->
    <text x="137" y="154" font-family="'Arial Black', 'Helvetica Neue', Arial, sans-serif" font-weight="900" font-size="21" fill="#ffffff" text-anchor="middle" letter-spacing="12">STORAGE</text>
  </g>
</svg>
